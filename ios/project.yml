name: ConfidentSpeak
options:
  bundleIdPrefix: com.anubisrooster.confidentspeak
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"

packages:
  GRDB:
    url: https://github.com/groue/GRDB.swift
    from: 6.29.0
  OnDeviceKit:
    url: https://github.com/AnubisRooster/OnDeviceKit
    from: "0.1.0"

settings:
  SWIFT_VERSION: "5.9"

targets:
  ConfidentSpeak:
    type: application
    platform: iOS
    sources:
      - path: ConfidentSpeak
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.anubisrooster.confidentspeak.app
      INFOPLIST_FILE: ConfidentSpeak/Resources/Info.plist
      DEVELOPMENT_TEAM: "${DEVELOPMENT_TEAM}"
      CODE_SIGN_STYLE: Automatic
      MARKETING_VERSION: "0.1.0"
      CURRENT_PROJECT_VERSION: "${BUILD_NUMBER:-1}"
    info:
      path: ConfidentSpeak/Resources/Info.plist
      properties:
        CFBundleName: "ConfidentSpeak"
        CFBundleDisplayName: "ConfidentSpeak"
        CFBundleVersion: "1"
        CFBundleShortVersionString: "0.1.0"
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        NSMicrophoneUsageDescription: "ConfidentSpeak records short practice clips so it can measure your pace and give feedback."
        NSSpeechRecognitionUsageDescription: "ConfidentSpeak transcribes your practice clips on-device to measure pace, filler words, and pauses."
    dependencies:
      - package: GRDB
      - package: OnDeviceKit
        product: BYOKLLMKit
    preBuildScripts:
      - name: "Regenerate XcodeGen"
        script: |
          if which xcodegen >/dev/null 2>&1; then
            xcodegen generate
          fi
        basedOnDependencyAnalysis: false

  ConfidentSpeakTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - ConfidentSpeakTests
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.anubisrooster.confidentspeak.tests
      TEST_TARGET_NAME: ConfidentSpeak
      GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: ConfidentSpeak
